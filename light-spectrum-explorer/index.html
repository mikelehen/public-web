<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Spectrum Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #1d232a; color: #a6adba; }
  </style>
</head>
<body data-theme="dark">
  <div id="root"></div>
  <script>
const { useState, useRef, useEffect, createElement: h } = React;

// ---- Spectrum Utils ----
function planck(wlNm, tempK) {
  const lambda = wlNm * 1e-9;
  const hc = 6.626e-34 * 3e8;
  const k = 1.381e-23;
  const exp = hc / (lambda * k * tempK);
  if (exp > 500) return 0;
  return (1 / Math.pow(lambda, 5)) * (1 / (Math.exp(exp) - 1));
}

function blackbody(tempK) {
  const pts = []; let max = 0;
  for (let wl = 380; wl <= 780; wl += 2) {
    const v = planck(wl, tempK);
    if (v > max) max = v;
    pts.push({ wavelength: wl, intensity: v });
  }
  return pts.map(p => ({ wavelength: p.wavelength, intensity: p.intensity / max }));
}

function gauss(x, mean, sigma) {
  return Math.exp(-0.5 * Math.pow((x - mean) / sigma, 2));
}

function fluorescent() {
  const pts = []; let max = 0;
  for (let wl = 380; wl <= 780; wl += 2) {
    let v = 0.15 + 0.08 * gauss(wl, 545, 60) + 0.06 * gauss(wl, 610, 40);
    v += 0.6 * gauss(wl, 405, 3) + 0.35 * gauss(wl, 436, 3);
    v += 1.0 * gauss(wl, 546, 4) + 0.5 * gauss(wl, 578, 4) + 0.15 * gauss(wl, 612, 3);
    v += 0.55 * gauss(wl, 490, 25) + 0.7 * gauss(wl, 545, 30) + 0.65 * gauss(wl, 612, 20);
    if (v > max) max = v;
    pts.push({ wavelength: wl, intensity: v });
  }
  return pts.map(p => ({ wavelength: p.wavelength, intensity: p.intensity / max }));
}

function ledWarm() {
  const pts = []; let max = 0;
  for (let wl = 380; wl <= 780; wl += 2) {
    const v = 0.7 * gauss(wl, 450, 12) + 1.0 * gauss(wl, 580, 70) + 0.3 * gauss(wl, 630, 50);
    if (v > max) max = v;
    pts.push({ wavelength: wl, intensity: v });
  }
  return pts.map(p => ({ wavelength: p.wavelength, intensity: p.intensity / max }));
}

function ledCool() {
  const pts = []; let max = 0;
  for (let wl = 380; wl <= 780; wl += 2) {
    const v = 1.0 * gauss(wl, 450, 12) + 0.7 * gauss(wl, 555, 65) + 0.15 * gauss(wl, 610, 45);
    if (v > max) max = v;
    pts.push({ wavelength: wl, intensity: v });
  }
  return pts.map(p => ({ wavelength: p.wavelength, intensity: p.intensity / max }));
}

function getSpectrum(id) {
  switch (id) {
    case 'sunlight': return blackbody(5778);
    case 'sunset': return blackbody(2500);
    case 'fire': return blackbody(1800);
    case 'incandescent': return blackbody(2700);
    case 'halogen': return blackbody(3100);
    case 'fluorescent': return fluorescent();
    case 'led-warm': return ledWarm();
    case 'led-cool': return ledCool();
    default: return [];
  }
}

function wlToColor(wl) {
  let r=0, g=0, b=0;
  if (wl>=380 && wl<440) { r=-(wl-440)/(440-380); b=1; }
  else if (wl>=440 && wl<490) { g=(wl-440)/(490-440); b=1; }
  else if (wl>=490 && wl<510) { g=1; b=-(wl-510)/(510-490); }
  else if (wl>=510 && wl<580) { r=(wl-510)/(580-510); g=1; }
  else if (wl>=580 && wl<645) { r=1; g=-(wl-645)/(645-580); }
  else if (wl>=645 && wl<=780) { r=1; }
  let f=1;
  if (wl>=380 && wl<420) f=0.3+0.7*(wl-380)/(420-380);
  else if (wl>=700 && wl<=780) f=0.3+0.7*(780-wl)/(780-700);
  return `rgb(${Math.round(r*f*255)},${Math.round(g*f*255)},${Math.round(b*f*255)})`;
}

// ---- Data ----
const SOURCES = [
  { id:'sunlight', name:'Sunlight (Noon)', color:'#fbbf24', desc:'Blackbody ~5778 K. Broad, fairly even spectrum peaking in blue-green.', temp:'5778 K', cat:'natural', on:true },
  { id:'sunset', name:'Sunset / Sunrise', color:'#f97316', desc:'Blackbody ~2500 K. Atmosphere scatters blue, leaving warm reds and oranges.', temp:'~2500 K', cat:'natural', on:true },
  { id:'fire', name:'Fire / Candlelight', color:'#dc2626', desc:'Blackbody ~1800 K. Dominated by deep red and infrared.', temp:'~1800 K', cat:'natural', on:true },
  { id:'incandescent', name:'Incandescent Bulb', color:'#fcd34d', desc:'Blackbody ~2700 K. Smooth continuous spectrum, ~90% energy is infrared heat.', temp:'2700 K', cat:'indoor', on:true },
  { id:'halogen', name:'Halogen', color:'#e5e7eb', desc:'Blackbody ~3100 K. Slightly hotter incandescent, excellent CRI ~100.', temp:'3100 K', cat:'indoor', on:false },
  { id:'fluorescent', name:'Fluorescent (CFL)', color:'#34d399', desc:'Mercury vapor lines + phosphor coating. Spiky spectrum with gaps.', temp:'4100 K', cat:'indoor', on:true },
  { id:'led-warm', name:'LED (Warm White)', color:'#a78bfa', desc:'Blue LED pump (~450 nm) + yellow phosphor. Blue spike + warm hump.', temp:'2700 K', cat:'indoor', on:true },
  { id:'led-cool', name:'LED (Cool White)', color:'#60a5fa', desc:'Stronger blue pump, cooler phosphor. Prominent blue spike.', temp:'5000 K', cat:'indoor', on:false },
];

// ---- Components ----
function SpectrumChart({ sources }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    const enabled = sources.filter(s => s.on);
    const wavelengths = Array.from({ length: Math.floor((780-380)/2)+1 }, (_,i) => 380+i*2);
    const datasets = enabled.map(s => {
      const spec = getSpectrum(s.id);
      return { label:s.name, data:spec.map(p=>p.intensity), borderColor:s.color, backgroundColor:s.color+'18', borderWidth:2.5, pointRadius:0, tension:0.3, fill:false };
    });
    const ctx = canvasRef.current.getContext('2d');
    if (chartRef.current) {
      chartRef.current.data.labels = wavelengths;
      chartRef.current.data.datasets = datasets;
      chartRef.current.update('none');
    } else {
      chartRef.current = new Chart(ctx, {
        type:'line', data:{ labels:wavelengths, datasets },
        options: {
          responsive:true, maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          plugins: {
            legend:{ display:true, position:'top', labels:{ color:'#a6adba', usePointStyle:true, pointStyle:'line', padding:16, font:{size:12} } },
            tooltip:{ backgroundColor:'rgba(30,35,40,0.95)', titleColor:'#e5e7eb', bodyColor:'#e5e7eb', borderColor:'rgba(255,255,255,0.1)', borderWidth:1, padding:12,
              callbacks:{
                title:(items)=>items[0]?items[0].label+' nm':'',
                label:(item)=>item.dataset.label+': '+(item.raw*100).toFixed(1)+'%',
                afterTitle:(items)=>{if(!items[0])return'';const wl=parseInt(items[0].label);if(wl<450)return'🟣 Violet-Blue';if(wl<495)return'🔵 Blue-Cyan';if(wl<570)return'🟢 Green-Yellow';if(wl<620)return'🟠 Orange';return'🔴 Red';}
              }
            }
          },
          scales: {
            x:{ title:{display:true,text:'Wavelength (nm)',color:'#a6adba',font:{size:13,weight:'bold'}}, ticks:{color:'#a6adba',maxTicksLimit:20,callback:function(v,i){const wl=wavelengths[i];return wl%40===0?wl:''}}, grid:{color:'rgba(255,255,255,0.06)'} },
            y:{ title:{display:true,text:'Relative Intensity',color:'#a6adba',font:{size:13,weight:'bold'}}, min:0, max:1.05, ticks:{color:'#a6adba',callback:(v)=>Math.round(v*100)+'%'}, grid:{color:'rgba(255,255,255,0.06)'} }
          }
        },
        plugins:[{
          id:'spectrumBg',
          beforeDraw:(chart)=>{
            const{ctx:c,chartArea}=chart;if(!chartArea)return;
            const{left,right,bottom}=chartArea;const w=right-left;
            for(let x=0;x<w;x++){const wl=380+(x/w)*400;c.fillStyle=wlToColor(wl);c.globalAlpha=0.8;c.fillRect(left+x,bottom-6,1,6);}
            c.globalAlpha=1;
          }
        }]
      });
    }
    return ()=>{};
  }, [sources]);

  useEffect(()=>()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}},[]);

  return h('div',{className:'w-full',style:{height:'420px'}}, h('canvas',{ref:canvasRef}));
}

function InfoPanel({ sources }) {
  const enabled = sources.filter(s=>s.on);
  if(!enabled.length) return null;
  return h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-2'},
    enabled.map(s=>h('div',{key:s.id,className:'flex items-start gap-2 p-2 bg-base-200 rounded-lg'},
      h('div',{className:'w-3 h-3 rounded-full mt-1 shrink-0',style:{backgroundColor:s.color}}),
      h('div',{className:'min-w-0'},
        h('div',{className:'font-medium text-sm text-base-content'},s.name),
        h('div',{className:'text-xs text-base-content/60'},s.temp+' \u00b7 '+s.desc)
      )
    ))
  );
}

function App() {
  const [sources,setSources] = useState(SOURCES);
  const toggle = (id) => setSources(prev=>prev.map(s=>s.id===id?{...s,on:!s.on}:s));
  const natural = sources.filter(s=>s.cat==='natural');
  const indoor = sources.filter(s=>s.cat==='indoor');

  function renderBtn(s) {
    const style = s.on ? {backgroundColor:s.color+'25',borderColor:s.color,color:s.color} : {};
    return h('button',{key:s.id,onClick:()=>toggle(s.id),className:'btn btn-sm gap-2 '+(s.on?'':'btn-ghost opacity-50'),style},
      h('span',{className:'w-2.5 h-2.5 rounded-full',style:{backgroundColor:s.color,opacity:s.on?1:0.4}}),
      s.name
    );
  }

  return h('div',{className:'p-4 flex flex-col gap-4 min-h-screen bg-base-100 max-w-5xl mx-auto'},
    h('h1',{className:'text-2xl font-bold text-base-content'},'🌈 Light Spectrum Explorer'),
    h('p',{className:'text-sm text-base-content/60'},
      'Compare the spectral power distributions of natural and artificial light sources across the visible spectrum (380–780 nm).'
    ),
    h('div',{className:'flex flex-col gap-3'},
      h('div',null,
        h('div',{className:'text-xs font-semibold text-base-content/50 uppercase tracking-wider mb-2'},'Natural Light'),
        h('div',{className:'flex flex-wrap gap-2'},natural.map(renderBtn))
      ),
      h('div',null,
        h('div',{className:'text-xs font-semibold text-base-content/50 uppercase tracking-wider mb-2'},'Indoor Lighting'),
        h('div',{className:'flex flex-wrap gap-2'},indoor.map(renderBtn))
      )
    ),
    h('div',{className:'card bg-base-200'},h('div',{className:'card-body p-3'},h(SpectrumChart,{sources}))),
    h(InfoPanel,{sources}),
    h('div',{className:'card bg-base-200'},h('div',{className:'card-body p-4 gap-2'},
      h('h3',{className:'text-sm font-semibold text-base-content'},'Key Takeaways'),
      h('ul',{className:'text-xs text-base-content/70 list-disc list-inside space-y-1'},
        h('li',null,h('strong',null,'Blackbody sources'),' (sun, fire, incandescent) produce smooth, continuous spectra. Hotter = more blue light.'),
        h('li',null,h('strong',null,'Fluorescents'),' have sharp mercury emission spikes at 405, 436, 546 & 578 nm with phosphor fill between gaps.'),
        h('li',null,h('strong',null,'LEDs'),' show a characteristic blue spike at ~450 nm (the pump diode) plus a broad phosphor hump.'),
        h('li',null,h('strong',null,'Sunset & fire'),' are heavily red-shifted — almost no blue — which is why they don\'t suppress melatonin.'),
        h('li',null,h('strong',null,'Cool white LEDs'),' have the most prominent blue spike, which can feel harsh and affect sleep cycles.')
      )
    )),
    h('div',{className:'card bg-base-200'},h('div',{className:'card-body p-4 gap-2'},
      h('h3',{className:'text-sm font-semibold text-base-content'},'References & Data Sources'),
      h('ul',{className:'text-xs text-base-content/70 list-disc list-inside space-y-1.5'},
        h('li',null,h('strong',null,'Planck\'s Law / Blackbody Radiation'),' — Used to model sunlight (5778 K), sunset (~2500 K), fire (~1800 K), incandescent (2700 K), and halogen (3100 K) spectra. See: ',
          h('a',{href:'https://www.pveducation.org/pvcdrom/properties-of-sunlight/blackbody-radiation',target:'_blank',className:'link link-primary'},'PV Education — Blackbody Radiation')),
        h('li',null,h('strong',null,'Solar Spectrum & Color Temperature'),' — Sun modeled as 5778 K blackbody per standard solar physics. ',
          h('a',{href:'https://en.wikipedia.org/wiki/Color_temperature',target:'_blank',className:'link link-primary'},'Wikipedia — Color Temperature')),
        h('li',null,h('strong',null,'Fluorescent Lamp SPD'),' — Mercury vapor emission lines at 405, 436, 546, and 578 nm with tri-phosphor coating modeled from published spectral data. See: ',
          h('a',{href:'https://dothemath.ucsd.edu/2012/05/spectral-extravaganza-the-ultimate-light/',target:'_blank',className:'link link-primary'},'Do the Math — Spectral Extravaganza (UCSD)')),
        h('li',null,h('strong',null,'LED Spectral Profiles'),' — Blue pump diode (~450 nm) + phosphor emission modeled from typical manufacturer SPD curves. See: ',
          h('a',{href:'https://www.energy.gov/sites/prod/files/2016/11/f34/royer_spectral-power-dist_denver2016.pdf',target:'_blank',className:'link link-primary'},'U.S. DOE — Spectral Power Distribution (PDF)')),
        h('li',null,h('strong',null,'General Light Source Spectra'),' — Cross-referenced with: ',
          h('a',{href:'https://evidentscientific.com/en/microscope-resource/knowledge-hub/lightandcolor/lightsourcesintro',target:'_blank',className:'link link-primary'},'Evident Scientific — Sources of Visible Light'),
          ' and ',
          h('a',{href:'https://www.researchgate.net/figure/Spectral-power-distribution-SPD-of-common-light-sources-at-100-lx-in-the-rage-of-400-nm_fig1_351659028',target:'_blank',className:'link link-primary'},'ResearchGate — SPD of Common Light Sources')),
        h('li',null,h('strong',null,'Wavelength-to-Color Mapping'),' — Based on CIE 1931 standard observer approximations for visible spectrum (380–780 nm).')
      ),
      h('p',{className:'text-xs text-base-content/50 mt-1'},'Note: Spectra are normalized to relative intensity for visual comparison. Blackbody curves use Planck\\'s radiation law; fluorescent and LED profiles are modeled approximations based on published empirical data.')
    )),
    h('div',{className:'text-center text-xs text-base-content/30 pb-4'},'Built with Tasklet AI')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
